# The "Before commit" commands from docs/stack.md, run on every push.
name: csharp-sample

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/csharp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Vulnerability scan
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt
